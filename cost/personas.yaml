# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 430
  base: 700
  high: 1000
  source: "Cơ sở: lớp L3 hơn 700 học viên (file track A, mục A5). Thấp: 700 × 8/13 học viên gặp thông tin phòng không khớp trong 1 tháng (khảo sát A7, n = 13). Cao: 1000 (tự ước tính, nếu mở cho cả L2)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.31             # 4/13 học viên: 0 lần tìm / hỏi lại phòng trong 1 tuần qua (khảo sát A2)
    uses_per_month: 1
    turns_per_session: 1
    source: "share: khảo sát A2 (4/13 trả lời 0 lần / tuần). uses_per_month = 1 (tự ước tính: chỉ hỏi khi nghe phòng đổi)"
  - name: dung_vua
    share: 0.38             # 5/13 học viên: 2–3 lần / tuần (khảo sát A2)
    uses_per_month: 10
    turns_per_session: 2
    source: "share + số lần: khảo sát A2 (5/13 trả lời 2–3 lần / tuần, ≈ 2,5 × 4 tuần = 10). turns_per_session = 2 (tự ước tính: một lượt hỏi lại khi thiếu lớp / nhóm)"
  - name: dung_nhieu
    share: 0.31             # 4/13 học viên: 4–6 lần / tuần (khảo sát A2)
    uses_per_month: 20
    turns_per_session: 2
    source: "share + số lần: khảo sát A2 (4/13 trả lời 4–6 lần / tuần, ≈ 5 × 4 tuần = 20). turns_per_session = 2 (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token. ≥2 mức model: gpt-5.4-nano (rẻ) · gpt-5.4-mini (mạnh hơn)
  - model: gpt-5.4-nano
    input: 0.20
    output: 1.25
    source: "https://developers.openai.com/api/docs/pricing?latest-pricing-expanded=true · xem 28/11/2026 · trang ghi model này 'Deprecated'; cached input $0.02 (không dùng: khung không tách token cache)"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "https://developers.openai.com/api/docs/pricing?latest-pricing-expanded=true · bảng Standard · xem 28/11/2026 ~04:10 · cached input $0.075 (không dùng)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
